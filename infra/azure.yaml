name: award-iq
metadata:
  template: award-iq-funding-readiness-poc

# Run azd from this directory after configuring the isolated funding lakehouse and Entra apps:
#   cd infra
#   azd up  # baseline only; optional intelligence/Work IQ inputs need explicit parameter bindings
# Set AZURE_SUBSCRIPTION_ID and the new AZURE_RESOURCE_GROUP explicitly in the azd environment.
# funding.parameters.json consumes the Fabric SQL and Entra configuration. Only public VITE_*
# values are emitted for the browser build; runtime Fabric reads use managed identity.
infra:
  provider: bicep
  path: .
  module: funding

# After provisioning, grant the app's managed identity Fabric workspace membership for live Fabric
# IQ and Reader on the backing capacity for the UI status indicator. Workspace membership is a
# Fabric REST call, not ARM, so it can't be in Bicep.
hooks:
  postprovision:
    shell: pwsh
    run: hooks/grant_app_identity_fabric.ps1
    continueOnError: false

services:
  api:
    project: ..
    host: containerapp
    language: python
    resourceName: ${API_CONTAINER_APP_NAME}
    hooks:
      postdeploy:
        shell: pwsh
        run: ./ensure_fabric_status_config.ps1
        dir: ./infra/hooks
        continueOnError: false
    docker:
      path: services/api/Dockerfile
      context: .
      remoteBuild: true
  web:
    project: ..\apps\web
    host: staticwebapp
    language: ts
    dist: dist
    resourceName: ${STATIC_WEB_APP_NAME}
