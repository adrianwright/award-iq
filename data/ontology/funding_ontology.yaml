meta:
  name: award-iq-funding-ontology
  version: 2
  domain: grant-eligibility-and-funding-readiness
  source_of_truth: data/fabric/funding_ops
  disclaimer: Synthetic grant decision support. Human funding decisions remain authoritative.

entities:
  FundingOpportunity:
    table: funding_opportunities.csv
    key: notice_id
    attributes: [program_id, project_id, applicant_org_id, geography_id, title, agency, eligible_applicant_types, eligible_geographies, deadline, deadline_timezone, as_of_date, total_eligible_cost, requested_amount, current_amendment_id, status]
  Program:
    table: programs.csv
    key: program_id
    attributes: [title, agency, scoring_objectives, evidence_document_id]
  Project:
    table: projects.csv
    key: project_id
    attributes: [notice_id, program_id, applicant_org_id, geography_id, title, status]
  Organization:
    table: organizations.csv
    key: organization_id
    attributes: [name, organization_type, geography_id]
  Geography:
    table: geographies.csv
    key: geography_id
    attributes: [name, geography_type, eligible_area]
  Amendment:
    table: amendments.csv
    key: amendment_id
    attributes: [notice_id, version, published_date, effective_date, predecessor_id, changed_conditions, match_rate, match_basis, regional_partner_required, status, source_document_id]
  EligibilityCriterion:
    table: eligibility_criteria.csv
    key: criterion_id
    attributes: [notice_id, amendment_id, criterion_type, rule, observed_fact, status, evidence_document_id]
  BudgetLine:
    table: budget_lines.csv
    key: line_id
    attributes: [notice_id, project_id, category, amount, currency, classification, evidence_document_id]
  MatchSource:
    table: match_sources.csv
    key: allocation_id
    attributes: [notice_id, project_id, source, amount, currency, status, evidence_date, owner_id, evidence_document_id, restrictions]
  Partner:
    table: partners.csv
    key: partner_id
    attributes: [partner_org_id, notice_id, region, partner_type, qualifies, commitment_status, letter_document_id, letter_date, historical_proposal_id, evidence_document_id]
  Person:
    table: people.csv
    key: person_id
    attributes: [name, role, team, email]
  PriorProposal:
    table: prior_proposals.csv
    key: proposal_id
    attributes: [notice_id, prior_notice_id, year, program_id, project_id, partner_id, outcome, outcome_evidence, lesson, letter_document_id, evidence_document_id]
  ProgramPerformance:
    table: program_performance.csv
    key: metric_id
    attributes: [program_id, project_id, measure, baseline_value, actual_value, proposed_target, period, unit, source_document_id]
  CommunityMetric:
    table: community_metrics.csv
    key: metric_id
    attributes: [program_id, geography_id, metric, value, unit, period, eligibility_relevance, source_document_id]
  StaffWorkload:
    table: staff_workload.csv
    key: workload_id
    attributes: [person_id, notice_id, team, period, available_capacity_hours, committed_work_hours, unavailable_from, unavailable_through, work_must_finish_by, dependency_ids, evidence_document_id]
  SchedulingSlot:
    table: scheduling_slots.csv
    key: slot_id
    attributes: [notice_id, reviewer_id, review_id, start_date, start_time, end_date, end_time, timezone, status, purpose, dependency_ids, evidence_document_id]
  ApprovalRecord:
    table: approvals.csv
    key: approval_id
    attributes: [notice_id, project_id, approval_type, required_owner_id, state, decision, decision_date, conditions, dependencies, evidence_document_id, record_type]
  Submission:
    table: submissions.csv
    key: submission_id
    attributes: [notice_id, project_id, proposal_owner_id, pursuit_state, submission_state, deadline, required_artifacts, blockers, unknown_requirements, dependency_ids, submitted_at, evidence_document_id]
  ProposalTask:
    table: proposal_tasks.csv
    key: task_id
    attributes: [notice_id, description, owner_id, status, due_date, dependency_ids, supporting_document_ids]
  SourceDocument:
    table: source_documents.csv
    key: document_id
    attributes: [notice_id, title, source, source_type, filename, version, publication_date, effective_from, supersedes, summary]

relationships:
  - [FundingOpportunity, for_program, Program, program_id]
  - [FundingOpportunity, has_project, Project, project_id]
  - [FundingOpportunity, has_amendment, Amendment, current_amendment_id]
  - [FundingOpportunity, has_criterion, EligibilityCriterion, notice_id]
  - [FundingOpportunity, has_budget, BudgetLine, notice_id]
  - [FundingOpportunity, has_match_source, MatchSource, notice_id]
  - [FundingOpportunity, has_partner, Partner, notice_id]
  - [FundingOpportunity, has_decision_record, ApprovalRecord, notice_id]
  - [FundingOpportunity, has_review_slot, SchedulingSlot, notice_id]
  - [FundingOpportunity, has_community_metric, CommunityMetric, program_id]
  - [FundingOpportunity, has_program_performance, ProgramPerformance, program_id]
  - [FundingOpportunity, has_submission, Submission, notice_id]
  - [Project, submitted_by, Organization, applicant_org_id]
  - [Project, located_in, Geography, geography_id]
  - [Project, belongs_to_program, Program, program_id]
  - [Partner, represented_by, Organization, partner_org_id]
  - [ProposalTask, owned_by, Person, owner_id]
  - [MatchSource, confirmed_by, Person, owner_id]
  - [SchedulingSlot, reviewed_by, Person, reviewer_id]
  - [StaffWorkload, describes, Person, person_id]
  - [ProposalTask, supported_by, SourceDocument, supporting_document_ids]
  - [Amendment, evidenced_by, SourceDocument, source_document_id]
  - [Program, described_by, SourceDocument, evidence_document_id]
  - [SchedulingSlot, dependent_on, ProposalTask, dependency_ids]
  - [StaffWorkload, dependent_on, ProposalTask, dependency_ids]
  - [Submission, dependent_on, ProposalTask, dependency_ids]
  - [Submission, dependent_on, StaffWorkload, dependency_ids]
  - [Submission, dependent_on, ApprovalRecord, dependency_ids]
  - [SourceDocument, supersedes, SourceDocument, supersedes]

rules:
  - Latest effective amendment on or before opportunity as_of_date controls, regardless of stale summaries.
  - Confirmed match sums unique MatchSource allocation_id values with status Confirmed; proposed and rejected amounts are excluded.
  - Missing and unknown are not zero, not-met, or evidence of ineligibility.
  - A current partner letter is satisfied only when a required current signed letter is recorded as received and linked to evidence.
  - Historical partner letters show a lead only; they do not satisfy a current notice condition.
  - Proposed program targets are not actual performance or guaranteed benefits.
  - ApprovalRecord is internal workflow metadata, not proof of a funding award.
  - Available SchedulingSlot is not held or booked; ProposalTask UI states remain Drafted (not submitted).
